<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kawaii Photobooth 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --pink: #ff6eb4;
  --pink2: #ff9dd2;
  --peach: #ffd4e8;
  --cream: #fff8f8;
  --lavender: #c9a0f5;
  --mint: #7de8c8;
  --yellow: #ffe066;
  --blue: #89d4f7;
  --red: #ff6b6b;
  --text: #4a2040;
  --shadow: rgba(255,110,180,0.25);
  --glass: rgba(255, 255, 255, 0.85);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

body {
  background: linear-gradient(135deg, #ffe0f0 0%, #f0e8ff 50%, #e0f4ff 100%);
  min-height: 100vh;
  font-family: 'Nunito', sans-serif;
  color: var(--text);
  overflow-x: hidden;
}

/* Floating deco */
.bg-deco {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
}
.bg-deco span {
  position: absolute;
  font-size: 1.8rem;
  animation: floatUp linear infinite;
  opacity: 0.18;
}
@keyframes floatUp {
  0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.18; }
  90% { opacity: 0.18; }
  100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
}

header {
  position: relative; z-index: 1;
  text-align: center;
  padding: 16px 16px 8px;
}
header h1 {
  font-family: 'Pacifico', cursive;
  font-size: 2.2rem;
  color: var(--pink);
  text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(255,110,180,0.15);
  letter-spacing: 1px;
}
header p {
  font-size: 0.85rem;
  color: #c07aaa;
  font-weight: 600;
  margin-top: 2px;
  letter-spacing: 0.5px;
}

/* ─── Main Layout Optimized for Mobile ─── */
.main-layout {
  position: relative; z-index: 1;
  max-width: 500px;
  margin: 0 auto;
  padding: 8px 12px 100px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* Viewfinder Wrap */
.viewfinder-wrap {
  background: #fff;
  border-radius: 24px;
  padding: 10px;
  box-shadow: 0 12px 30px var(--shadow), 0 2px 0 #fff inset;
  border: 3px solid #ffb3d9;
  position: relative;
  transition: transform 0.3s ease;
}

.viewfinder {
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  background: #1a0a14;
  aspect-ratio: 4/3;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
}

#video {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transform: scaleX(-1);
  transition: filter 0.3s ease;
}

#frameOverlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}

#stickerLayer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 6;
}
.preview-sticker {
  position: absolute;
  font-size: 2.5rem;
  line-height: 1;
  cursor: move;
  pointer-events: all;
  user-select: none;
  touch-action: none;
  filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.2));
  transition: transform 0.1s ease;
}
.preview-sticker:active { transform: scale(1.3) !important; }

/* Countdown */
#countdown {
  position: absolute; inset: 0;
  display: none;
  align-items: center; justify-content: center;
  background: rgba(255, 160, 209, 0.4);
  backdrop-filter: blur(4px);
  z-index: 20;
}
#countNum {
  font-family: 'Pacifico', cursive;
  font-size: 7rem;
  color: #fff;
  text-shadow: 0 0 25px var(--pink), 4px 4px 0 var(--pink);
  animation: pulse 0.8s ease infinite;
}
@keyframes pulse { 0% {transform:scale(0.8)} 50% {transform:scale(1.1)} 100% {transform:scale(0.8)} }

.flash-overlay {
  position: absolute; inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 25;
}
.flash-overlay.pop { animation: flashAnim 0.3s ease-out; }
@keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }

.cam-error {
  position: absolute; inset: 0;
  display: none;
  flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px;
  background: #fff5fb;
  font-size: 0.9rem;
  color: #c07aaa;
  text-align: center;
  padding: 20px;
}

/* Row Styling */
.mode-row, .timer-row {
  display: flex; gap: 8px; justify-content: center; width: 100%;
}
.mode-chip, .timer-chip {
  flex: 1;
  padding: 8px 10px;
  border-radius: 50px;
  border: 2px solid #ffb3d9;
  background: #fff;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.8rem;
  cursor: pointer;
  color: #c07aaa;
  text-align: center;
  box-shadow: 0 3px 8px rgba(255,110,180,0.1);
  transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.mode-chip.active, .mode-chip:hover {
  background: linear-gradient(135deg, var(--lavender), #a78bfa);
  border-color: var(--lavender); color: #fff;
  transform: translateY(-2px);
}
.timer-chip.active, .timer-chip:hover {
  background: linear-gradient(135deg, var(--pink), var(--pink2));
  border-color: var(--pink); color: #fff;
  transform: translateY(-2px);
}

/* Controls Bar */
.controls-bar {
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 5px 0;
}

/* Pulse Shutter Effect */
.shutter-btn-wrap {
  position: relative;
  display: inline-block;
}
.shutter-btn-wrap::after {
  content: ''; position: absolute; inset: -6px; border-radius: 50%;
  border: 2px solid var(--pink2); opacity: 0.4;
  animation: pulseRing 2s infinite; pointer-events: none;
}
@keyframes pulseRing { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.25); opacity: 0; } }

.shutter-btn {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: linear-gradient(145deg, #ff8ec6, var(--pink));
  border: 4px solid #fff;
  box-shadow: 0 6px 20px rgba(255,110,180,0.45);
  cursor: pointer; font-size: 1.8rem;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.1s;
}
.shutter-btn:active { transform: scale(0.9); }

.ctrl-btn {
  width: 46px; height: 46px;
  border-radius: 50%;
  border: 2px solid #ffb3d9;
  background: #fff;
  font-size: 1.2rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 10px var(--shadow);
  transition: transform 0.2s;
}
.ctrl-btn:active { transform: scale(0.9) rotate(-15deg); }

/* Panels with horizontal scroll optimized for phone fingers */
.panel {
  background: var(--glass);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border-radius: 20px;
  padding: 14px;
  box-shadow: 0 6px 20px var(--shadow);
  border: 2px solid #ffb3d9;
}
.panel-title {
  font-family: 'Pacifico', cursive;
  font-size: 0.95rem;
  color: var(--pink);
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}

/* Horizontal Scroll Container for Selectors */
.mobile-scroll-row {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 4px 2px 8px;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
}
.mobile-scroll-row::-webkit-scrollbar { height: 5px; }
.mobile-scroll-row::-webkit-scrollbar-thumb { background: var(--pink2); border-radius: 10px; }

/* Grid Conversions for Mobile Scroll */
.frame-grid, .sticker-grid {
  display: flex; /* Thay thế grid sang flex để cuộn ngang trên Mobile */
}

.frame-opt {
  flex: 0 0 70px;
  aspect-ratio: 3/4;
  border-radius: 12px;
  border: 3px solid transparent;
  cursor: pointer; overflow: hidden; position: relative;
  background: #fff5fb;
  transition: all 0.2s;
}
.frame-opt canvas { width: 100%; height: 100%; position: absolute; inset: 0; }
.frame-opt .frame-label {
  position: absolute; bottom: 0; left: 0; right: 0;
  text-align: center; font-size: 0.55rem; font-weight: 800;
  color: #c07aaa; background: rgba(255,255,255,0.85); padding: 2px 0;
}
.frame-opt.active { border-color: var(--pink); transform: scale(1.05); box-shadow: 0 4px 12px var(--shadow); }

.sticker-item {
  flex: 0 0 44px; height: 44px;
  border-radius: 12px;
  background: #fff;
  border: 2px solid #ffb3d9;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem; cursor: pointer;
  transition: transform 0.15s;
}
.sticker-item:active { transform: scale(1.2); }

.filter-chip {
  flex: 0 0 auto;
  padding: 6px 16px;
  border-radius: 50px;
  border: 2px solid #ffb3d9;
  background: #fff;
  font-size: 0.8rem; font-weight: 700; color: #c07aaa;
}
.filter-chip.active {
  background: linear-gradient(135deg, var(--pink), var(--pink2));
  border-color: var(--pink); color: #fff;
}

/* Album / Gallery Grid */
.gallery-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  max-height: 120px; overflow-y: auto;
}
.gal-thumb {
  aspect-ratio: 3/4; border-radius: 8px; overflow: hidden;
  border: 2px solid #ffb3d9; transition: transform 0.2s;
}
.gal-thumb img { width:100%; height:100%; object-fit:cover; }
.gal-empty { grid-column:1/-1; text-align:center; color:#c07aaa; font-size:0.8rem; padding:12px 0; }

/* Strip Result Display */
.strip-wrap {
  background: #fff;
  border-radius: 24px;
  padding: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  border: 3px solid #ffb3d9;
  display: none;
  animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
}
@keyframes slideUp { from {transform: translateY(40px); opacity: 0;} to {transform: translateY(0); opacity: 1;} }

.strip-wrap h3 {
  font-family: 'Pacifico', cursive; color: var(--pink);
  font-size: 1.1rem; text-align: center; margin-bottom: 12px;
}
#stripCanvas {
  width: 100%; border-radius: 14px; display: block;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
.strip-actions { display: flex; gap: 12px; margin-top: 14px; }
.strip-btn {
  flex: 1; padding: 12px; border-radius: 50px; border: none;
  font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.9rem;
  cursor: pointer; transition: all 0.2s;
}
.strip-btn.save {
  background: linear-gradient(135deg, var(--pink), var(--lavender)); color: #fff;
  box-shadow: 0 4px 14px rgba(255,110,180,0.4);
}
.strip-btn.retake { background: #f3eff2; color: #9c6287; }

/* Toast Notification */
#toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(30px);
  background: linear-gradient(135deg, #4a2040, var(--pink));
  color: #fff; padding: 10px 24px; border-radius: 50px;
  font-weight: 700; font-size: 0.85rem; opacity: 0;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; z-index: 9999;
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}
#toast.show { opacity:1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="bg-deco" id="bgDeco"></div>

<header>
  <h1>✨ Kawaii Photobooth ✨</h1>
  <p>🌸 chụp ảnh cute cùng bạn bè 🌸</p>
</header>

<div class="main-layout">
  <div class="viewfinder-wrap" id="cameraContainer">
    <div class="viewfinder">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="frameOverlay"></canvas>
      <div id="stickerLayer"></div>
      <div id="countdown"><span id="countNum">3</span></div>
      <div class="flash-overlay" id="flash"></div>
      <div class="cam-error" id="camErr">
        <span style="font-size:3rem">📷</span>
        <div>Không thể kết nối Camera</div>
        <small>Vui lòng mở quyền truy cập trong cài đặt</small>
      </div>
    </div>
  </div>

  <div class="mode-row">
    <button class="mode-chip active" data-shots="1">1 Ảnh</button>
    <button class="mode-chip" data-shots="3">3 Ảnh</button>
    <button class="mode-chip" data-shots="4">4 Ảnh</button>
  </div>
  
  <div class="timer-row">
    <button class="timer-chip active" data-val="0">Không hẹn giờ</button>
    <button class="timer-chip" data-val="3">Hẹn giờ 3s ⏱</button>
    <button class="timer-chip" data-val="5">Hẹn giờ 5s ⏱</button>
  </div>

  <div class="controls-bar">
    <button class="ctrl-btn" id="flipBtn" title="Đổi camera">🔄</button>
    <div class="shutter-btn-wrap">
      <button class="shutter-btn" id="shutterBtn">📸</button>
    </div>
    <button class="ctrl-btn" id="clearStickersBtn" title="Xóa hết nhãn dán">🧹</button>
  </div>

  <div class="strip-wrap" id="stripWrap">
    <h3>🎞 Phim ảnh của bạn đây!</h3>
    <canvas id="stripCanvas"></canvas>
    <div class="strip-actions">
      <button class="strip-btn retake" id="retakeBtn">↩ Chụp lại</button>
      <button class="strip-btn save" id="saveBtn">💾 Tải về máy</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">🖼 Khung viền cute</div>
    <div class="mobile-scroll-row frame-grid" id="frameGrid"></div>
  </div>

  <div class="panel">
    <div class="panel-title">🎨 Bộ lọc màu sắc</div>
    <div class="mobile-scroll-row" id="filterRow"></div>
  </div>

  <div class="panel">
    <div class="panel-title">🌟 Dán Nhãn trang trí</div>
    <div class="mobile-scroll-row sticker-grid" id="stickerGrid"></div>
  </div>

  <div class="panel">
    <div class="panel-title">🗂 Album ảnh đã lưu</div>
    <div class="gallery-grid" id="gallery">
      <div class="gal-empty">Chưa chụp bức ảnh nào hết á~ 🌸</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ─── DATA SYSTEM ─── */
const STICKERS = [
  '🌸','🌺','🌼','🌻','✨','💫','🌟','🎀','🐱','🐰','🐻','🐼',
  '🍓','🍒','🍰','🧁','🍭','💖','💗','💓','💝','🌈','☁️','🌙'
];

const FILTERS = [
  { name:'Bản gốc',   css:'none' },
  { name:'Rực rỡ',    css:'saturate(1.7) contrast(1.1)' },
  { name:'Mơ mộng',   css:'brightness(1.12) contrast(0.9) saturate(1.1)' },
  { name:'Ấm áp',    css:'sepia(0.25) saturate(1.35) brightness(1.05)' },
  { name:'Cổ điển',   css:'sepia(0.5) contrast(1.1) brightness(0.95)' },
  { name:'Hồng Phấn', css:'hue-rotate(330deg) saturate(1.2) brightness(1.05)' }
];

const FRAMES = [
  { name:'Trơn',     draw: null },
  { name:'Anh Đào',   draw: drawBlossom },
  { name:'Ngôi Sao',  draw: drawStars },
  { name:'Trái Tim',  draw: drawHearts },
  { name:'Cầu Vồng', draw: drawRainbow },
  { name:'Mây Bay',  draw: drawClouds }
];

let currentFrame = 0, currentFilter = 0, timerVal = 0, shotMode = 1;
let shots = [], placedStickers = [], stream = null, facingMode = 'user', isBusy = false;
let dragSticker = null, dragOffX = 0, dragOffY = 0;

const video = document.getElementById('video');
const frameOvC = document.getElementById('frameOverlay');
const frameOvCtx = frameOvC.getContext('2d');
const stickerLayer = document.getElementById('stickerLayer');
const cdEl = document.getElementById('countdown');
const cdNum = document.getElementById('countNum');
const flashEl = document.getElementById('flash');
const stripWrap = document.getElementById('stripWrap');
const stripCanvas = document.getElementById('stripCanvas');
const stripCtx = stripCanvas.getContext('2d');
const gallery = document.getElementById('gallery');

/* ─── BACKGROUND DECORATION ─── */
const BG_EMOJIS = ['🌸','⭐','💖','✨','🌟','🌈'];
const bgDeco = document.getElementById('bgDeco');
for (let i = 0; i < 12; i++) {
  const s = document.createElement('span');
  s.textContent = BG_EMOJIS[i % BG_EMOJIS.length];
  s.style.left = Math.random()*100 + 'vw';
  s.style.animationDuration = (10 + Math.random()*10) + 's';
  s.style.animationDelay = (Math.random()*8) + 's';
  s.style.fontSize = (1.2 + Math.random()*1) + 'rem';
  bgDeco.appendChild(s);
}

/* ─── STABLE CAMERA UTILS ─── */
async function startCamera(mode='user') {
  if (stream) stream.getTracks().forEach(t=>t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: mode, width:{ideal:800}, height:{ideal:600} }, audio:false
    });
    video.srcObject = stream;
    document.getElementById('camErr').style.display = 'none';
    video.addEventListener('play', resizeOverlay, {once:true});
  } catch(e) {
    document.getElementById('camErr').style.display = 'flex';
  }
}

function resizeOverlay() {
  frameOvC.width = video.videoWidth || 640;
  frameOvC.height = video.videoHeight || 480;
  drawFrameOverlay();
}

document.getElementById('flipBtn').addEventListener('click', () => {
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  video.style.transform = facingMode === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
  startCamera(facingMode);
  showToast("🔄 Đã chuyển đổi camera!");
});

function drawFrameOverlay() {
  const w = frameOvC.width, h = frameOvC.height;
  frameOvCtx.clearRect(0,0,w,h);
  if (FRAMES[currentFrame].draw) FRAMES[currentFrame].draw(frameOvCtx, w, h);
}

setInterval(() => {
  if (video.videoWidth && !isBusy) {
    if (!frameOvC.width) resizeOverlay();
    else drawFrameOverlay();
  }
}, 100);

/* ─── CANVAS PROCEDURAL FRAMES ─── */
function drawBlossom(ctx, w, h) {
  const bw = Math.max(w,h)*0.04;
  ctx.strokeStyle = '#ff9dd2'; ctx.lineWidth = bw;
  ctx.strokeRect(bw/2, bw/2, w-bw, h-bw);
  ctx.fillStyle = '#ff6eb4';
  ctx.font = `${bw*1.2}px serif`;
  ctx.fillText('🌸', bw, bw*1.5); ctx.fillText('🌸', w-bw*2, bw*1.5);
  ctx.fillText('🌸', bw, h-bw); ctx.fillText('🌸', w-bw*2, h-bw);
}
function drawStars(ctx, w, h) {
  const bw = Math.max(w,h)*0.04;
  ctx.strokeStyle = '#ffe066'; ctx.lineWidth = bw;
  ctx.strokeRect(bw/2, bw/2, w-bw, h-bw);
  ctx.fillStyle = '#ffb347';
  ctx.font = `${bw*1.1}px serif`;
  ctx.fillText('⭐', w/2, bw*1.3); ctx.fillText('⭐', bw, h/2);
  ctx.fillText('⭐', w-bw*2, h/2);
}
function drawHearts(ctx, w, h) {
  const bw = Math.max(w,h)*0.04;
  ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = bw;
  ctx.strokeRect(bw/2, bw/2, w-bw, h-bw);
  ctx.fillStyle = '#ff6b6b';
  ctx.font = `${bw*1.1}px serif`;
  ctx.fillText('💖', bw, bw*1.5); ctx.fillText('💝', w-bw*2, h-bw);
}
function drawRainbow(ctx, w, h) {
  const bw = Math.max(w,h)*0.04;
  const colors = ['#ff6b6b','#ffe066','#7de8c8','#89d4f7'];
  colors.forEach((c,i) => {
    ctx.strokeStyle = c; ctx.lineWidth = bw/4;
    const off = (bw/4)*i + bw/8;
    ctx.strokeRect(off, off, w-off*2, h-off*2);
  });
}
function drawClouds(ctx, w, h) {
  const bw = Math.max(w,h)*0.04;
  ctx.strokeStyle = '#89d4f7'; ctx.lineWidth = bw;
  ctx.strokeRect(bw/2, bw/2, w-bw, h-bw);
  ctx.font = `${bw}px serif`;
  ctx.fillText('☁️', bw*1.5, bw*1.3); ctx.fillText('☁️', w-bw*2.5, bw*1.3);
}

/* ─── BUILD COMPONENT INTERFACES ─── */
function initUI() {
  // Build Frames
  const fGrid = document.getElementById('frameGrid');
  FRAMES.forEach((f,i) => {
    const btn = document.createElement('button');
    btn.className = 'frame-opt' + (i===0?' active':'');
    const tc = document.createElement('canvas');
    tc.width = 60; tc.height = 80;
    const tctx = tc.getContext('2d');
    tctx.fillStyle = '#fff5fb'; tctx.fillRect(0,0,60,80);
    if (f.draw) f.draw(tctx, 60, 80);
    btn.appendChild(tc);
    const lbl = document.createElement('div');
    lbl.className='frame-label'; lbl.textContent=f.name;
    btn.appendChild(lbl);
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.frame-opt').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentFrame = i;
    });
    fGrid.appendChild(btn);
  });

  // Build Filters
  const filRow = document.getElementById('filterRow');
  FILTERS.forEach((f,i) => {
    const btn = document.createElement('button');
    btn.className = 'filter-chip' + (i===0?' active':'');
    btn.textContent = f.name;
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = i;
      video.style.filter = f.css;
    });
    filRow.appendChild(btn);
  });

  // Build Stickers
  const sGrid = document.getElementById('stickerGrid');
  STICKERS.forEach(emoji => {
    const btn = document.createElement('button');
    btn.className = 'sticker-item';
    btn.textContent = emoji;
    btn.addEventListener('click', () => addSticker(emoji));
    sGrid.appendChild(btn);
  });
}

/* ─── MOBILE TOUCH STICKER DRAG-DROP ─── */
function addSticker(emoji) {
  const el = document.createElement('div');
  el.className = 'preview-sticker';
  el.textContent = emoji;
  el.style.left = '50%';
  el.style.top = '50%';
  el.style.transform = 'translate(-50%,-50%)';

  const setupDrag = (e) => {
    dragSticker = el;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const rect = el.getBoundingClientRect();
    dragOffX = clientX - (rect.left + rect.width/2);
    dragOffY = clientY - (rect.top + rect.height/2);
  };

  el.addEventListener('mousedown', setupDrag);
  el.addEventListener('touchstart', setupDrag, {passive: true});
  stickerLayer.appendChild(el);
}

const moveDrag = (e) => {
  if (!dragSticker) return;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const parent = stickerLayer.getBoundingClientRect();
  
  let x = ((clientX - parent.left - dragOffX) / parent.width) * 100;
  let y = ((clientY - parent.top - dragOffY) / parent.height) * 100;
  
  dragSticker.style.left = Math.max(0, Math.min(100, x)) + '%';
  dragSticker.style.top = Math.max(0, Math.min(100, y)) + '%';
};

document.addEventListener('mousemove', moveDrag);
document.addEventListener('touchmove', moveDrag, {passive: false});
const endDrag = () => { dragSticker = null; };
document.addEventListener('mouseup', endDrag);
document.addEventListener('touchend', endDrag);

document.getElementById('clearStickersBtn').addEventListener('click', ()=>{
  stickerLayer.innerHTML = '';
  showToast("🧹 Đã dọn sạch nhãn dán!");
});

/* ─── TIMING & CONFIG HANDLERS ─── */
document.querySelectorAll('.timer-chip').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.timer-chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    timerVal = parseInt(btn.dataset.val);
  });
});

document.querySelectorAll('.mode-chip').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.mode-chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    shotMode = parseInt(btn.dataset.shots);
  });
});

/* ─── CAPTURE SYSTEM WORKFLOW ─── */
document.getElementById('shutterBtn').addEventListener('click', ()=>{
  if (isBusy) return;
  stripWrap.style.display = 'none';
  shots = [];
  
  // Cuộn mượt màn hình lên camera khi nhấn chụp
  document.getElementById('cameraContainer').scrollIntoView({ behavior: 'smooth' });

  if (timerVal > 0) {
    isBusy = true;
    let rem = timerVal;
    cdEl.style.display = 'flex';
    cdNum.textContent = rem;
    const iv = setInterval(()=>{
      rem--;
      if (rem <= 0) {
        clearInterval(iv);
        cdEl.style.display = 'none';
        isBusy = false;
        runSession();
      } else {
        cdNum.textContent = rem;
      }
    }, 1000);
  } else {
    runSession();
  }
});

async function runSession() {
  isBusy = true;
  for (let i=0; i<shotMode; i++) {
    if (i > 0) await new Promise(r => setTimeout(r, 900));
    await captureOne();
  }
  buildStrip();
  isBusy = false;
}

function captureOne() {
  return new Promise(resolve => {
    flashEl.classList.add('pop');
    setTimeout(() => flashEl.classList.remove('pop'), 200);

    const w = video.videoWidth || 640;
    const h = video.videoHeight || 480;
    const tmp = document.createElement('canvas');
    tmp.width = w; tmp.height = h;
    const tc = tmp.getContext('2d');

    if (facingMode === 'user') { tc.translate(w,0); tc.scale(-1,1); }
    tc.filter = FILTERS[currentFilter].css;
    tc.drawImage(video, 0, 0);
    tc.filter = 'none';
    if (facingMode === 'user') { tc.setTransform(1,0,0,1,0,0); }

    if (FRAMES[currentFrame].draw) FRAMES[currentFrame].draw(tc, w, h);

    const stickers = stickerLayer.querySelectorAll('.preview-sticker');
    stickers.forEach(s => {
      const px = parseFloat(s.style.left)/100 * w;
      const py = parseFloat(s.style.top)/100 * h;
      tc.font = `${w * 0.08}px serif`;
      tc.textAlign = 'center';
      tc.textBaseline = 'middle';
      tc.fillText(s.textContent, px, py);
    });

    shots.push(tmp.toDataURL('image/jpeg', 0.95));
    setTimeout(resolve, 150);
  });
}

/* ─── OUTPUT STRIP GENERATOR ─── */
function buildStrip() {
  const PHOTO_W = 400, PHOTO_H = 300;
  const PAD = 20, TOP = 50, BOTTOM = 70;
  const STRIP_W = PHOTO_W + PAD*2;
  const STRIP_H = TOP + (PHOTO_H + PAD) * shots.length + BOTTOM;

  stripCanvas.width = STRIP_W;
  stripCanvas.height = STRIP_H;

  stripCtx.fillStyle = '#fff0f8';
  stripCtx.fillRect(0, 0, STRIP_W, STRIP_H);

  // Film holes effect
  stripCtx.fillStyle = 'rgba(230, 150, 190, 0.4)';
  for (let y = TOP; y < STRIP_H - BOTTOM; y += 30) {
    stripCtx.fillRect(6, y, 6, 12);
    stripCtx.fillRect(STRIP_W - 12, y, 6, 12);
  }

  // Header Title
  stripCtx.fillStyle = '#ff6eb4';
  stripCtx.font = 'bold 18px sans-serif';
  stripCtx.textAlign = 'center';
  stripCtx.fillText('🌸 KAWAII PHOTOBOOTH 🌸', STRIP_W/2, TOP - 18);

  const promises = shots.map((src, i) => {
    return new Promise(res => {
      const img = new Image();
      img.onload = () => {
        const y = TOP + i * (PHOTO_H + PAD);
        stripCtx.fillStyle = '#fff';
        stripCtx.fillRect(PAD - 4, y - 4, PHOTO_W + 8, PHOTO_H + 8);
        stripCtx.drawImage(img, PAD, y, PHOTO_W, PHOTO_H);
        res();
      };
      img.src = src;
    });
  });

  Promise.all(promises).then(() => {
    // Footer Stamp Date
    const fy = STRIP_H - 25;
    stripCtx.fillStyle = '#c07aaa';
    stripCtx.font = 'bold 14px sans-serif';
    stripCtx.fillText(`✨ ${new Date().toLocaleDateString('vi-VN')} ✨`, STRIP_W/2, fy);

    stripWrap.style.display = 'block';
    stripWrap.scrollIntoView({ behavior: 'smooth' });
    updateGallery(stripCanvas.toDataURL());
  });
}

function updateGallery(dataUrl) {
  const empty = gallery.querySelector('.gal-empty');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = 'gal-thumb';
  const img = document.createElement('img');
  img.src = dataUrl;
  div.appendChild(img);
  gallery.insertBefore(div, gallery.firstChild);
}

/* ─── INTERACTION UTILS ─── */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

document.getElementById('saveBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = `kawaii-booth-${Date.now()}.jpg`;
  link.href = stripCanvas.toDataURL('image/jpeg', 0.95);
  link.click();
  showToast("💾 Đang tải hình ảnh xuống thiết bị!");
});

document.getElementById('retakeBtn').addEventListener('click', () => {
  stripWrap.style.display = 'none';
  document.getElementById('cameraContainer').scrollIntoView({ behavior: 'smooth' });
  showToast("📸 Sẵn sàng chụp lại album mới!");
});

// START
initUI();
startCamera('user');
</script>
